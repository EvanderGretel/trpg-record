<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="TRPG 團務紀錄：開跑 → 結團、KP / PL、單人 / 雙人 / 多人，資料存在瀏覽器本機。">
<title>TRPG 團務紀錄</title>
<!-- 改用 CDN，放到網路上才載得到 -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  /* ===== 主題變數 ===== */
  :root{
    color-scheme: light;
    --bg:#f5f6fa;
    --surface:#ffffff;
    --border:#eceef5;
    --border-strong:#dde0e9;
    --text:#20242e;
    --text-2:#5b6274;
    --text-3:#78808f;
    --text-4:#98a0ae;
    --accent:#6446e0;
    --accent-hover:#5638c9;
    --accent-soft:#7c5cff;
    --teal:#159b8b;
    --amber:#c9821a;
    --rose:#d94f72;
    --input-bg:#fafbfe;
    --hover:#f5f6fa;
    --row-hover:#faf9ff;
    --thead-bg:#fbfbfe;
    --grid:#f0f1f7;
    --ring:rgba(124,92,255,.13);
    --shadow:0 1px 3px rgba(20,25,40,.05),0 10px 26px -16px rgba(20,25,40,.25);
    --overlay:rgba(20,25,40,.45);
    --b-kp-bg:#efeaff; --b-kp-fg:#6446e0;
    --b-pl-bg:#e2f7f4; --b-pl-fg:#159b8b;
    --danger:#d94f72; --danger-hover:#c33d5e; --danger-soft:#fdeef3;
  }
  html[data-theme="dark"]{
    color-scheme: dark;
    --bg:#12141a;
    --surface:#1b1e27;
    --border:#282c38;
    --border-strong:#353a49;
    --text:#e8eaf1;
    --text-2:#aab1c2;
    --text-3:#8b93a6;
    --text-4:#6e7789;
    --accent:#8b6dff;
    --accent-hover:#7a5bf0;
    --accent-soft:#9d84ff;
    --teal:#3ec9b8;
    --amber:#f0b458;
    --rose:#f0789a;
    --input-bg:#222633;
    --hover:#252a36;
    --row-hover:#20242f;
    --thead-bg:#1f232d;
    --grid:#2a2e3b;
    --ring:rgba(157,132,255,.22);
    --shadow:0 1px 3px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.7);
    --overlay:rgba(0,0,0,.62);
    --b-kp-bg:rgba(124,92,255,.2); --b-kp-fg:#b3a3ff;
    --b-pl-bg:rgba(62,201,184,.16); --b-pl-fg:#5fd8c8;
    --danger:#f0789a; --danger-hover:#e2607f; --danger-soft:rgba(240,120,154,.13);
  }

  *{box-sizing:border-box}
  body{
    margin:0;padding:28px 20px 60px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;
    transition:background .2s ease, color .2s ease;
  }
  .wrap{max-width:1240px;margin:0 auto}

  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
  h1{font-size:24px;margin:0;letter-spacing:.02em}
  .sub{color:var(--text-3);font-size:13px;margin-top:8px;line-height:1.6}
  .theme-btn{font-size:16px;padding:8px 12px;line-height:1;flex:none}

  /* ===== 說明 / 聲明區塊 ===== */
  .notice{
    margin-top:18px;
    background:var(--surface);
    border:1px solid var(--border);
    border-left:3px solid var(--amber);
    border-radius:12px;
    padding:14px 16px;
    box-shadow:var(--shadow);
    font-size:12.5px;
    line-height:1.85;
    color:var(--text-2);
    transition:background .2s ease,border-color .2s ease;
  }
  .notice .row{display:flex;gap:9px;align-items:flex-start}
  .notice .row + .row{margin-top:7px}
  .notice .ico{flex:none;line-height:1.6}
  .notice strong{color:var(--text);font-weight:700}
  .notice code{
    background:var(--hover);border:1px solid var(--border);
    border-radius:5px;padding:1px 5px;font-size:11.5px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0 16px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;
        box-shadow:var(--shadow);transition:background .2s ease,border-color .2s ease}
  .card .label{font-size:12px;color:var(--text-3);letter-spacing:.05em}
  .card .value{font-size:26px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.2}
  .card .unit{font-size:12px;color:var(--text-4);font-weight:500;margin-left:5px}
  .card.violet .value{color:var(--accent-soft)}
  .card.teal   .value{color:var(--teal)}
  .card.amber  .value{color:var(--amber)}
  .card.rose   .value{color:var(--rose)}

  .charts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
  .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;
              box-shadow:var(--shadow);transition:background .2s ease,border-color .2s ease}
  .chart-card.wide{grid-column:1/-1}
  .chart-card h2{font-size:14px;margin:0 0 12px;color:var(--text-2);font-weight:600}
  .canvas-box{position:relative;height:238px}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--surface);
           border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:14px;
           box-shadow:var(--shadow);transition:background .2s ease,border-color .2s ease}
  select,input{font:inherit;font-size:13px;padding:7px 11px;border:1px solid var(--border-strong);border-radius:9px;
               background:var(--input-bg);color:var(--text);outline:none;transition:.15s}
  select:focus,input:focus{border-color:var(--accent-soft);box-shadow:0 0 0 3px var(--ring)}
  #fSearch{flex:1;min-width:160px}
  .count{margin-left:auto;font-size:12px;color:var(--text-3);white-space:nowrap}

  .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:auto;max-height:72vh;
              box-shadow:var(--shadow);transition:background .2s ease,border-color .2s ease}
  table{border-collapse:collapse;width:100%;font-size:13px;min-width:900px}
  thead th{position:sticky;top:0;z-index:2;background:var(--thead-bg);text-align:left;padding:11px 14px;
           font-weight:600;color:var(--text-2);border-bottom:1px solid var(--border);white-space:nowrap;
           cursor:pointer;user-select:none;transition:color .15s}
  thead th:hover{color:var(--accent-soft)}
  thead th .arrow{font-size:9px;margin-left:4px;color:var(--accent-soft)}
  thead th.no-sort{cursor:default}
  thead th.no-sort:hover{color:var(--text-2)}
  tbody td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:top}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--row-hover)}
  td.idx{color:var(--text-4);font-variant-numeric:tabular-nums;width:44px}
  td.ttl{font-weight:600;min-width:170px}
  td.date{white-space:nowrap;color:var(--text-2);font-variant-numeric:tabular-nums}
  td.num{white-space:nowrap;color:var(--text-2);font-variant-numeric:tabular-nums;width:60px}
  td.note{color:var(--text-3);font-size:12px;max-width:260px}
  td.actions{white-space:nowrap;width:118px}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.03em}
  .b-kp{background:var(--b-kp-bg);color:var(--b-kp-fg)}
  .b-pl{background:var(--b-pl-bg);color:var(--b-pl-fg)}

  .empty{padding:48px 20px;text-align:center;color:var(--text-4);font-size:13px;line-height:2}
  .empty b{color:var(--text-2)}

  .btn{font:inherit;font-size:13px;padding:8px 14px;border-radius:9px;border:1px solid var(--border-strong);
       background:var(--surface);cursor:pointer;transition:.15s;font-weight:500;color:var(--text)}
  .btn:hover{background:var(--hover)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
  .btn.danger{color:var(--danger);border-color:var(--border-strong)}
  .btn.danger:hover{background:var(--danger-soft);border-color:var(--danger)}
  .icon-btn{font:inherit;font-size:12px;padding:4px 9px;border-radius:6px;border:1px solid var(--border-strong);
            background:var(--surface);cursor:pointer;color:var(--text-2);transition:.15s;margin-right:4px}
  .icon-btn:hover{background:var(--hover)}
  .icon-btn.del:hover{color:var(--danger);border-color:var(--danger);background:var(--danger-soft)}

  .overlay{position:fixed;inset:0;background:var(--overlay);display:none;z-index:100;
           align-items:center;justify-content:center;padding:20px;overflow-y:auto}
  .overlay.open{display:flex}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;max-width:520px;width:100%;
         padding:22px 22px 18px;box-shadow:0 20px 60px rgba(20,25,40,.3);max-height:90vh;overflow-y:auto}
  .modal h3{margin:0 0 16px;font-size:16px}
  .form-row{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:start;margin-bottom:11px}
  .form-row label{font-size:13px;color:var(--text-2);font-weight:500;padding-top:8px}
  .form-row input,.form-row select,.form-row textarea{
    font:inherit;font-size:13px;padding:8px 11px;border:1px solid var(--border-strong);border-radius:9px;
    background:var(--input-bg);color:var(--text);outline:none;width:100%;transition:.15s;
  }
  .form-row textarea{resize:vertical;min-height:70px;font-family:inherit}
  .form-row input:focus,.form-row select:focus,.form-row textarea:focus{
    border-color:var(--accent-soft);box-shadow:0 0 0 3px var(--ring);background:var(--surface);
  }
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .hint{font-size:11px;color:var(--text-4);margin-top:4px}

  @media (max-width:820px){
    .charts{grid-template-columns:1fr}
    body{padding:20px 12px 50px}
    .form-row{grid-template-columns:1fr;gap:4px}
    .form-row label{padding-top:0}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="head">
    <div>
      <h1>TRPG 團務紀錄</h1>
      <p class="sub">開跑 → 結團 ｜ KP / PL ｜ 單人 / 雙人 / 多人</p>
    </div>
    <button class="btn theme-btn" id="btnTheme" title="切換深色模式" aria-label="切換深色模式">🌙</button>
  </header>

  <!-- ===== 聲明 ===== -->
  <section class="notice">
    <div class="row">
      <span class="ico">ℹ️</span>
      <span>本工具由 <strong>AI 協助製作</strong>，可能仍有 Bug 或未盡完善之處，使用前請自行評估；若發現問題，歡迎直接修改原始碼或回報給分享者。</span>
    </div>
    <div class="row">
      <span class="ico">⚠️</span>
      <span>
        所有資料只存在<strong>你自己這台裝置的瀏覽器</strong>（<code>localStorage</code>），<strong>不會上傳到任何伺服器</strong>；
        換裝置、清除快取或更換瀏覽器都會看不到，請定期按「⬇ 匯出」備份。
      </span>
    </div>
  </section>

  <section class="cards" id="cards"></section>

  <section class="charts">
    <div class="chart-card wide">
      <h2>每月結團數（依結團月份）</h2>
      <div class="canvas-box"><canvas id="chartMonth"></canvas></div>
    </div>
    <div class="chart-card">
      <h2>角色比例</h2>
      <div class="canvas-box"><canvas id="chartRole"></canvas></div>
    </div>
    <div class="chart-card">
      <h2>人數規模</h2>
      <div class="canvas-box"><canvas id="chartSize"></canvas></div>
    </div>
  </section>

  <section class="toolbar">
    <select id="fYear"></select>
    <select id="fRole">
      <option value="all" selected>全部角色</option>
      <option value="KP">只看 KP</option>
      <option value="PL">只看 PL</option>
    </select>
    <select id="fSize">
      <option value="all" selected>全部規模</option>
      <option value="單人">單人</option>
      <option value="雙人">雙人</option>
      <option value="多人">多人</option>
    </select>
    <input id="fSearch" type="search" placeholder="搜尋標題 / 備註…">
    <button class="btn primary" id="btnAdd">＋ 新增</button>
    <button class="btn" id="btnExport" title="將目前資料匯出成 JSON 檔">⬇ 匯出</button>
    <button class="btn" id="btnImport" title="從 JSON 檔匯入資料">⬆ 匯入</button>
    <button class="btn danger" id="btnClear" title="清除所有資料">🗑 清除全部</button>
    <span class="count" id="countLabel">共 0 筆</span>
  </section>

  <section class="table-wrap">
    <table>
      <thead id="thead">
        <tr>
          <th class="no-sort">#</th>
          <th data-key="title">標題<span class="arrow"></span></th>
          <th data-key="role">角色<span class="arrow"></span></th>
          <th data-key="size">規模<span class="arrow"></span></th>
          <th data-key="startDate">開跑日<span class="arrow"></span></th>
          <th data-key="endDate">結團日<span class="arrow"></span></th>
          <th data-key="dur">天數<span class="arrow"></span></th>
          <th data-key="note">備註<span class="arrow"></span></th>
          <th class="no-sort">操作</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </section>

</div>

<input type="file" id="fileImport" accept=".json,application/json" hidden>

<!-- 編輯 / 新增 彈窗 -->
<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <h3 id="modalTitle">編輯紀錄</h3>
    <div class="form-row"><label>標題</label><input id="eTitle" type="text" placeholder="團務標題"></div>
    <div class="form-row"><label>角色</label>
      <select id="eRole">
        <option value="KP">KP</option>
        <option value="PL">PL</option>
      </select>
    </div>
    <div class="form-row"><label>規模</label>
      <select id="eSize">
        <option value="單人">單人</option>
        <option value="雙人">雙人</option>
        <option value="多人">多人</option>
      </select>
    </div>
    <div class="form-row"><label>開跑日</label><input id="eStart" type="date"></div>
    <div class="form-row"><label>結團日</label><input id="eEnd" type="date"></div>
    <div class="form-row"><label>備註</label><textarea id="eNote" placeholder="PL、KP、其他備註…"></textarea></div>
    <div class="hint">小提示：按 Esc 取消，Ctrl / ⌘ + Enter 儲存</div>
    <div class="modal-actions">
      <button class="btn" id="btnCancel">取消</button>
      <button class="btn primary" id="btnSave">儲存</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   ① 預設資料（預設為空；可透過「⬆ 匯入」載入 JSON）
   ============================================================ */
const DEFAULT_DATA = [];

/* ============================================================
   ② 資料存取（localStorage）
   ============================================================ */
const LS_KEY = 'trpg_records_v1';
const THEME_KEY = 'trpg_theme_v1';

const $  = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const fmt = s => s ? s.replace(/-/g,'/') : '—';
const clone = o => JSON.parse(JSON.stringify(o));

function loadData(){
  try{
    const s = localStorage.getItem(LS_KEY);
    if(s){
      const d = JSON.parse(s);
      if(Array.isArray(d)) return d.filter(x => x && typeof x === 'object');
    }
  }catch(e){ console.warn('讀取 localStorage 失敗', e); }
  return clone(DEFAULT_DATA);
}
function persist(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(RAW)); }
  catch(e){ console.warn('儲存 localStorage 失敗', e); }
}

let RAW = loadData();
let editingId = null;
const charts = {};
const state = { year:'', role:'all', size:'all', q:'', sortKey:'endDate', sortDir:'asc' };

function dur(r){
  if(!r.startDate || !r.endDate) return null;
  return Math.round((new Date(r.endDate+'T00:00:00') - new Date(r.startDate+'T00:00:00')) / 86400000) + 1;
}
function getYears(){
  return [...new Set(RAW.map(r => (r.endDate||'').slice(0,4)).filter(Boolean))].sort().reverse();
}

/* 年份下拉選單 */
function refreshYearSelect(){
  const years = getYears();
  const sel = $('#fYear');
  if(state.year && !years.includes(state.year)) state.year = '';
  sel.innerHTML =
    years.map(y => `<option value="${y}">${y} 年</option>`).join('') +
    '<option value="">全部年份</option>';
  sel.value = state.year;
}

/* ============================================================
   ③ 主題（明亮 / 黑夜）
   ============================================================ */
function currentTheme(){
  return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
}
function applyTheme(t, rerender){
  document.documentElement.setAttribute('data-theme', t);
  try{ localStorage.setItem(THEME_KEY, t); }catch(e){}
  const btn = $('#btnTheme');
  btn.textContent = t === 'dark' ? '☀️' : '🌙';
  btn.title = t === 'dark' ? '切換為明亮模式' : '切換為黑夜模式';
  if(rerender){ renderCharts(currentList()); }
}
(function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem(THEME_KEY); }catch(e){}
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(saved || (prefersDark ? 'dark' : 'light'), false);
})();

function themeColors(){
  const dark = currentTheme() === 'dark';
  return {
    text:  dark ? '#aab1c2' : '#5b6274',
    grid:  dark ? '#2a2e3b' : '#f0f1f7',
    kp:    dark ? '#9d84ff' : '#7c5cff',
    pl:    dark ? '#3ec9b8' : '#2bb3a3',
    size:  dark ? ['#f0b458','#6aabff','#f0789a'] : ['#f2a33c','#5b9dff','#e0607e']
  };
}

/* ============================================================
   ④ 篩選 + 排序
   ============================================================ */
function currentList(){
  let list = RAW.filter(r => {
    if(state.year && (r.endDate||'').slice(0,4) !== state.year) return false;
    if(state.role !== 'all' && r.role !== state.role) return false;
    if(state.size !== 'all' && r.size !== state.size) return false;
    if(state.q){
      const q = state.q.toLowerCase();
      if(!((r.title||'') + ' ' + (r.note||'')).toLowerCase().includes(q)) return false;
    }
    return true;
  });
  const dir = state.sortDir === 'asc' ? 1 : -1;
  list.sort((a,b) => {
    if(state.sortKey === 'dur') return ((dur(a)||0) - (dur(b)||0)) * dir;
    return String(a[state.sortKey] ?? '').localeCompare(String(b[state.sortKey] ?? ''), 'zh-Hant') * dir;
  });
  return list;
}

/* ============================================================
   ⑤ 統計卡片
   ============================================================ */
function renderCards(list){
  const total = list.length;
  const kp = list.filter(r => r.role === 'KP').length;
  const pl = total - kp;
  const ds = list.map(dur).filter(d => d != null);
  const avg = ds.length ? Math.round(ds.reduce((a,b)=>a+b,0) / ds.length) : 0;
  const byMonth = new Array(12).fill(0);
  list.forEach(r => {
    const m = Number((r.endDate||'').slice(5,7));
    if(m >= 1 && m <= 12) byMonth[m-1]++;
  });
  let peak = 0, pi = -1;
  byMonth.forEach((c,i) => { if(c > peak){ peak = c; pi = i; } });

  const cards = [
    ['結團總數', total, '本', 'violet'],
    ['KP役', kp, '本', 'violet'],
    ['PL役', pl, '本', 'teal'],
    ['平均團期', avg, '天', 'amber'],
    ['最活躍月份', pi >= 0 ? (pi+1) + ' 月' : '—', peak ? peak + ' 本' : '', 'rose']
  ];
  $('#cards').innerHTML = cards.map(([label,value,unit,cls]) => `
    <div class="card ${cls}">
      <div class="label">${label}</div>
      <div class="value">${value}<span class="unit">${unit}</span></div>
    </div>`).join('');
}

/* ============================================================
   ⑥ 圖表
   ============================================================ */
function draw(id, config){
  if(typeof Chart === 'undefined') return;
  if(charts[id]) charts[id].destroy();
  charts[id] = new Chart(document.getElementById(id), config);
}
function renderCharts(list){
  if(typeof Chart === 'undefined') return;
  const C = themeColors();

  const kpM = new Array(12).fill(0), plM = new Array(12).fill(0);
  list.forEach(r => {
    const m = Number((r.endDate||'').slice(5,7)) - 1;
    if(m < 0 || m > 11) return;
    (r.role === 'KP' ? kpM : plM)[m]++;
  });

  draw('chartMonth', {
    type:'bar',
    data:{
      labels:['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'],
      datasets:[
        {label:'KP', data:kpM, backgroundColor:C.kp, borderRadius:5, stack:'s', maxBarThickness:38},
        {label:'PL', data:plM, backgroundColor:C.pl, borderRadius:5, stack:'s', maxBarThickness:38}
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      scales:{
        x:{stacked:true, grid:{display:false}, ticks:{font:{size:11}, color:C.text}},
        y:{stacked:true, beginAtZero:true, ticks:{precision:0, font:{size:11}, color:C.text}, grid:{color:C.grid}}
      },
      plugins:{
        legend:{position:'bottom', labels:{usePointStyle:true, pointStyle:'circle', boxWidth:8, boxHeight:8, font:{size:11}, color:C.text}},
        tooltip:{callbacks:{label:c => ` ${c.dataset.label}：${c.parsed.y} 本`}}
      }
    }
  });

  const kp = list.filter(r => r.role === 'KP').length;
  const pl = list.length - kp;
  draw('chartRole', {
    type:'doughnut',
    data:{ labels:['KP','PL'], datasets:[{data:[kp,pl], backgroundColor:[C.kp,C.pl], borderWidth:0, hoverOffset:6}] },
    options:{
      responsive:true, maintainAspectRatio:false, cutout:'62%',
      plugins:{
        legend:{position:'bottom', labels:{usePointStyle:true, pointStyle:'circle', boxWidth:8, boxHeight:8, font:{size:11}, color:C.text}},
        tooltip:{callbacks:{label:c => ` ${c.label}：${c.parsed} 本`}}
      }
    }
  });

  const sizes = ['單人','雙人','多人'];
  draw('chartSize', {
    type:'bar',
    data:{
      labels:sizes,
      datasets:[{ data:sizes.map(s => list.filter(r => r.size === s).length),
                  backgroundColor:C.size, borderRadius:6, maxBarThickness:42 }]
    },
    options:{
      responsive:true, maintainAspectRatio:false, indexAxis:'y',
      scales:{
        x:{beginAtZero:true, ticks:{precision:0, font:{size:11}, color:C.text}, grid:{color:C.grid}},
        y:{grid:{display:false}, ticks:{font:{size:12}, color:C.text}}
      },
      plugins:{legend:{display:false}, tooltip:{callbacks:{label:c => ` ${c.parsed.x} 本`}}}
    }
  });
}

/* ============================================================
   ⑦ 表格
   ============================================================ */
function renderTable(list){
  const tbody = $('#tbody');
  if(!list.length){
    tbody.innerHTML = `<tr><td colspan="9" class="empty">
      ${RAW.length
        ? '沒有符合條件的紀錄，試著調整篩選或搜尋條件。'
        : '還沒有任何紀錄 ——<br>點 <b>「＋ 新增」</b> 開始記錄，或 <b>「⬆ 匯入」</b> 載入先前匯出的 JSON 檔。'}
    </td></tr>`;
    return;
  }
  tbody.innerHTML = list.map((r,i) => {
    const d = dur(r);
    return `<tr data-id="${r.id}">
      <td class="idx">${i+1}</td>
      <td class="ttl">${esc(r.title)}</td>
      <td><span class="badge ${r.role === 'KP' ? 'b-kp' : 'b-pl'}">${esc(r.role)}</span></td>
      <td>${esc(r.size)}</td>
      <td class="date">${fmt(r.startDate)}</td>
      <td class="date">${fmt(r.endDate)}</td>
      <td class="num">${d ?? '—'}</td>
      <td class="note">${esc(r.note || '').replace(/\n/g,'<br>')}</td>
      <td class="actions">
        <button class="icon-btn" data-action="edit" data-id="${r.id}">編輯</button>
        <button class="icon-btn del" data-action="del" data-id="${r.id}">刪除</button>
      </td>
    </tr>`;
  }).join('');
}

function updateHeaders(){
  document.querySelectorAll('#thead th[data-key]').forEach(th => {
    const arrow = th.querySelector('.arrow');
    if(arrow) arrow.textContent = th.dataset.key === state.sortKey ? (state.sortDir === 'asc' ? '▲' : '▼') : '';
  });
}

/* ============================================================
   ⑧ 總渲染
   ============================================================ */
function render(){
  const list = currentList();
  renderCards(list);
  renderCharts(list);
  renderTable(list);
  updateHeaders();
  $('#countLabel').textContent = `共 ${list.length} 筆`;
}

/* ============================================================
   ⑨ 編輯 / 新增 / 刪除
   ============================================================ */
function openModal(id){
  editingId = id || null;
  const r = id ? RAW.find(x => x.id === id) : null;
  $('#modalTitle').textContent = id ? '編輯紀錄' : '新增紀錄';
  $('#eTitle').value = r ? r.title : '';
  $('#eRole').value  = r ? r.role  : 'KP';
  $('#eSize').value  = r ? r.size  : '單人';
  $('#eStart').value = r ? (r.startDate || '') : '';
  $('#eEnd').value   = r ? (r.endDate   || '') : '';
  $('#eNote').value  = r ? (r.note || '') : '';
  $('#overlay').classList.add('open');
  setTimeout(() => $('#eTitle').focus(), 40);
}
function closeModal(){
  $('#overlay').classList.remove('open');
  editingId = null;
}
function saveModal(){
  const title = $('#eTitle').value.trim();
  if(!title){ alert('請輸入標題'); $('#eTitle').focus(); return; }

  const payload = {
    title,
    role: $('#eRole').value,
    size: $('#eSize').value,
    startDate: $('#eStart').value,
    endDate: $('#eEnd').value,
    note: $('#eNote').value
  };
  if(payload.startDate && payload.endDate && payload.endDate < payload.startDate){
    if(!confirm('結團日早於開跑日，確定要儲存嗎？')) return;
  }

  if(editingId){
    const r = RAW.find(x => x.id === editingId);
    if(r) Object.assign(r, payload);
  }else{
    payload.id = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    RAW.push(payload);
  }
  persist();
  refreshYearSelect();
  render();
  closeModal();
}
function deleteRow(id){
  const r = RAW.find(x => x.id === id);
  if(!r) return;
  if(!confirm(`確定要刪除「${r.title}」？\n此操作無法復原。`)) return;
  RAW = RAW.filter(x => x.id !== id);
  persist();
  refreshYearSelect();
  render();
}

/* ============================================================
   ⑩ 匯出 / 匯入 / 清除
   ============================================================ */
function exportJSON(){
  if(!RAW.length){
    alert('目前沒有任何資料可以匯出。');
    return;
  }
  const blob = new Blob([JSON.stringify(RAW, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const stamp = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  a.href = url;
  a.download = `trpg-records-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

function normalizeRecord(r, i){
  if(!r || typeof r !== 'object' || Array.isArray(r)) return null;
  const title = String(r.title ?? '').trim();
  if(!title) return null;
  const role = (r.role === 'PL' || r.role === 'KP') ? r.role : 'KP';
  const size = ['單人','雙人','多人'].includes(r.size) ? r.size : '單人';
  const normDate = v => {
    const s = String(v ?? '').trim().replace(/\//g, '-');
    return /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : '';
  };
  return {
    id: 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2,8) + i,
    title,
    role,
    size,
    startDate: normDate(r.startDate),
    endDate: normDate(r.endDate),
    note: String(r.note ?? '')
  };
}

function importJSON(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(String(reader.result));
      if(!Array.isArray(data)) throw new Error('JSON 最外層必須是陣列格式');
      const records = data.map(normalizeRecord).filter(Boolean);
      if(!records.length) throw new Error('檔案中沒有有效的紀錄');

      if(RAW.length){
        const ok = confirm(
          `準備匯入 ${records.length} 筆紀錄。\n\n` +
          `確定後將「覆蓋」目前已有的 ${RAW.length} 筆資料（無法復原）。\n` +
          `建議先取消並「匯出」備份現有資料。\n\n要繼續覆蓋嗎？`
        );
        if(!ok) return;
      }
      RAW = records;
      persist();
      state.year = '';
      refreshYearSelect();
      render();
      alert(`成功匯入 ${records.length} 筆紀錄！`);
    }catch(err){
      alert('匯入失敗：' + err.message);
    }
  };
  reader.onerror = () => alert('讀取檔案失敗，請確認檔案是否正確。');
  reader.readAsText(file, 'utf-8');
}

function clearAll(){
  if(!RAW.length){ alert('目前沒有任何資料。'); return; }
  const ok = confirm(
    `即將清除全部 ${RAW.length} 筆紀錄。\n\n` +
    `⚠️ 此操作無法復原，建議先按「⬇ 匯出」備份資料。\n\n` +
    `確定要清除嗎？`
  );
  if(!ok) return;
  RAW = [];
  persist();
  state.year = '';
  refreshYearSelect();
  render();
}

/* ============================================================
   ⑪ 事件綁定
   ============================================================ */
$('#fYear').addEventListener('change', e => { state.year = e.target.value; render(); });
$('#fRole').addEventListener('change', e => { state.role = e.target.value; render(); });
$('#fSize').addEventListener('change', e => { state.size = e.target.value; render(); });
$('#fSearch').addEventListener('input', e => { state.q = e.target.value; render(); });

document.querySelectorAll('#thead th[data-key]').forEach(th => {
  th.addEventListener('click', () => {
    const k = th.dataset.key;
    if(state.sortKey === k) state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
    else { state.sortKey = k; state.sortDir = 'asc'; }
    render();
  });
});

$('#tbody').addEventListener('click', e => {
  const btn = e.target.closest('button[data-action]');
  if(!btn) return;
  const id = btn.dataset.id;
  if(btn.dataset.action === 'edit') openModal(id);
  else if(btn.dataset.action === 'del') deleteRow(id);
});

$('#btnAdd').addEventListener('click', () => openModal(null));
$('#btnExport').addEventListener('click', exportJSON);
$('#btnImport').addEventListener('click', () => $('#fileImport').click());
$('#fileImport').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if(f) importJSON(f);
  e.target.value = '';
});
$('#btnClear').addEventListener('click', clearAll);
$('#btnTheme').addEventListener('click', () => {
  applyTheme(currentTheme() === 'dark' ? 'light' : 'dark', true);
});

$('#btnCancel').addEventListener('click', closeModal);
$('#btnSave').addEventListener('click', saveModal);
$('#overlay').addEventListener('click', e => { if(e.target === $('#overlay')) closeModal(); });
document.addEventListener('keydown', e => {
  if(!$('#overlay').classList.contains('open')) return;
  if(e.key === 'Escape'){ e.preventDefault(); closeModal(); }
  if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ e.preventDefault(); saveModal(); }
});

/* Chart.js 若 CDN 載入失敗，改用備援 CDN 補載 */
if(typeof Chart === 'undefined'){
  const s = document.createElement('script');
  s.src = 'https://unpkg.com/chart.js@4.4.1/dist/chart.umd.min.js';
  s.onload = () => { if(typeof render === 'function') render(); };
  s.onerror = () => console.warn('Chart.js 載入失敗，圖表將不會顯示（其餘功能正常）。');
  document.head.appendChild(s);
}

/* ============================================================
   ⑫ 初始化
   ============================================================ */
refreshYearSelect();
render();
</script>
</body>
